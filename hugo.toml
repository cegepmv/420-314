baseURL = 'https://cegepmv.github.io/420-314/'
languageCode = 'fr-ca'
title = 'Programmation de plateformes embarquées'
theme = 'hugo-theme-relearn'
enableEmoji = true

[markup.goldmark.renderer]
  unsafe = true

[markup.goldmark.extensions]
  math = true

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$'], ['\\[', '\\]']]
    inline = [['$', '$'], ['\\(', '\\)']]

[params]
  themeVariant = "green"
  disableLandingPageButton = true
  alwaysopen = false
  disableInlineCopyToClipBoard = true
  disableBreadcrumb = false
  disableToc = true
  disableNextPrev = true
  hideAuthorDate = true
  
  # CRUCIAL for Relearn theme when using passthrough math:
  math = true 

  [params.imageEffects]
    border = false
    lazy = true
    lightbox = false
    shadow = false